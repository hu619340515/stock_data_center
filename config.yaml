# 数据库配置
database:
  path: "quant_data.db"  # 数据库文件路径，默认保存在项目根目录下，支持相对路径和绝对路径
  stock_path: "stock_data.db"  # 股票数据库文件路径
  etf_path: "etf_data.db"  # ETF数据库文件路径

# QMT/xtquant 配置（国金QMT通常通过本机 miniQMT/QMT + xtquant 提供行情）
qmt:
  ip: "127.0.0.1"  # 本机QMT行情服务地址
  port: 58610  # MiniQMT/miniquote 行情端口；普通交易端 58600 不提供完整历史行情接口
  data_dir: ""  # 可选：miniQMT userdata_mini 目录；留空则使用 xtquant 默认目录
  dividend_type: "front"  # none/front/back/front_ratio/back_ratio
  download_before_query: true  # 查询历史行情前先同步下载到本地缓存
  sync_sector_data: false  # download_sector_data 在部分券商环境会长时间阻塞，默认不在启动路径同步
  code_list_data_dir: ""  # 板块为空时，从QMT本地datadir推导股票/ETF代码
  stock_sectors: ["沪深A股"]  # QMT板块名，可按券商环境调整
  etf_sectors: ["沪深ETF", "沪深基金"]  # QMT板块名，可按券商环境调整

# 并发与性能配置
concurrency:
  max_workers: 10  # QMT本地缓存下载并发数
  dynamic_concurrency: true  # 是否启用动态并发控制，true表示根据错误率和成功率自动调整进程数
  min_workers: 3  # 最小并发进程数，当错误率过高时会减少到此值
  max_workers_limit: 10  # 最大并发进程数限制，动态调整时不会超过此值
  error_threshold: 3  # 错误率阈值(%)，当错误率超过此值时自动减少进程数
  success_threshold: 95  # 成功率阈值(%)，当成功率超过此值时自动增加进程数

# 批量写入优化
batch:
  size: 50  # 初始批处理大小，每积累50只股票的数据后批量写入数据库
  max_size: 200  # 最大批处理大小，动态调整时不会超过此值
  min_size: 20  # 最小批处理大小，动态调整时不会低于此值
  memory_threshold: 0.8  # 内存使用率阈值(0-1)，当内存使用率超过80%时自动减少批处理大小

# 重试机制配置
retry:
  max_retries: 200  # 最大重试次数，网络错误时会自动重试此次数
  initial_retry_delay: 1  # 初始重试延迟时间(秒)，第一次重试等待1秒
  max_retry_delay: 10  # 最大重试延迟时间(秒)，重试延迟不会超过此值
  retry_backoff_factor: 2  # 重试退避因子，每次重试延迟时间乘以此因子(1秒、2秒、4秒...)

# 数据源配置
datasource:
  default: "qmt"  # 默认数据源
  stock_source: "qmt"  # 股票数据源
  etf_source: "qmt"  # ETF数据源
  priority: ["qmt"]  # 数据源优先级列表

# 数据范围配置
data:
  start_date_full: "2000-01-01"  # 股票全量下载的起始日期，首次运行时从此日期开始下载
  start_date_full_etf: "2000-01-01"  # ETF全量下载的起始日期，首次运行时从此日期开始下载
  # end_date: ""  # 可选拉取结束日期，不配置则自动使用当前日期（18点前用前一天，18点后用当天）

# 错误处理配置
error:
  log_file: "error_log.txt"  # 错误日志文件路径，记录所有下载失败的股票和错误信息
  max_errors_before_warning: 10  # 累计错误数警告阈值，每累计10个错误时在控制台显示警告信息

# 进程监控与复活配置
process_monitor:
  enable_revive: true  # 是否启用进程自动复活功能，true表示当进程卡住或异常退出时自动重启
  heartbeat_timeout: 120  # 进程心跳超时时间(秒)，如果进程超过此时间没有输出任何日志/进度，则认为已卡住
  max_revive_times: 20  # 单个进程最大复活次数，超过此次数后不再重启，避免无限循环

# 数据处理配置
processing:
  use_arrow: false  # 是否使用Apache Arrow格式处理数据，true可提升大数据量的处理性能但需要额外依赖
  compress_data: true  # 是否压缩数据，true表示在传输和存储时压缩数据以节省带宽和磁盘空间
